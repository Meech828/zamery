<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калькулятор замеров</title>
<meta name="description" content="Личный калькулятор замеров тела: вес и объёмы, дашборд прогресса. Данные хранятся только на вашем устройстве.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Замеры">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Cpath d='M8 52C8 25 22 10 32 10s24 15 24 42H44c0-13-5-20-12-20s-12 7-12 20z' fill='%23d1232a' stroke='%23d9b46a' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Cpath d='M8 52C8 25 22 10 32 10s24 15 24 42H44c0-13-5-20-12-20s-12 7-12 20z' fill='%23d1232a' stroke='%23d9b46a' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<style>
:root{--ink:#fff;--bg:#000;--panel:#0f0f0f;--panel2:#161616;--line:#262626;--line2:#333;--muted:#9b9b9b;--red:#d1232a;--red2:#8e1217;--gold:#d9b46a;--good:#0b7a55;--bad:#c0392b;--good-d:#8fe3a9;--good-dbg:#13291c;--bad-d:#ff8f84;--bad-dbg:#3a1416;--neu-d:#b5b5b5;--neu-dbg:#1f1f1f;--hl:#1c1c1c;--focus:rgba(209,35,42,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000}
body{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1200px 600px at 50% -200px,#1a1a1a,#000 70%) #000;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 48px}
.hidden{display:none!important}
.L{font-weight:300}
::placeholder{color:#9a9a9a;opacity:1}

/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.04em;font-size:16px;text-transform:uppercase;margin-right:auto}
.logo{width:34px;height:34px;display:grid;place-items:center;flex:none}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
.tab{border:0;background:none;padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.tab svg{flex:none}
.tab.on{background:#fff;color:#000}
.savebox{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:300}
.dot{width:7px;height:7px;border-radius:50%;background:#5fbf86;flex:none}
.dot.err{background:var(--red)}

/* controls */
.btn{border:1px solid var(--line2);background:transparent;color:#fff;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
.btn:hover{border-color:#666}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:#e02b33}
.btn.lime{background:#fff;border-color:#fff;color:#000}
.btn.big{padding:15px 26px;font-size:15px;letter-spacing:.02em}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:#fff}
.btn.danger{color:var(--bad-d)}
.btn.armed{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.sel{border:1px solid var(--line2);background:#000;color:#fff;border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;max-width:100%}
.sel option{background:#111;color:#fff}
.inp{width:100%;border:0;border-radius:999px;padding:12px 18px;background:#fff;color:#111;font-size:16px;font-weight:500}
.inp:focus,.sel:focus{outline:3px solid var(--focus);outline-offset:1px}
input[type=date].inp{color-scheme:light}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:24px;margin-bottom:16px}
.panel h2{margin:0 0 6px;font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.panel .sub{color:var(--muted);font-size:14px;margin:0 0 18px;line-height:1.55;font-weight:300}
.fld label,.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 7px 4px;text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}
.msg{font-size:14px;color:var(--good-d);font-weight:600;min-height:20px;margin-top:10px}
.msg.err{color:var(--bad-d)}
.hint{font-size:13px;color:var(--muted);line-height:1.5;font-weight:300}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px dashed #555;background:none;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;color:#cfcfcf}
.chip:hover{border-style:solid;border-color:#fff;color:#fff}
.seg{display:inline-flex;background:#000;border:1px solid var(--line2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:#000}
.switch{position:relative;display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:500;color:#cfcfcf;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch i{width:40px;height:23px;border-radius:999px;background:#3a3a3a;position:relative;transition:.15s;flex:none}
.switch i:after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked+i{background:var(--red)}
.switch input:checked+i:after{left:20px}
.switch input:focus-visible+i{outline:2px solid var(--focus)}
details.rules{border:1px solid var(--line);border-radius:22px;padding:14px 18px;margin-top:4px;background:#0a0a0a}
details.rules summary{font-weight:700;cursor:pointer;font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.rl{display:flex;gap:18px;align-items:center;margin-top:14px}
.rl .n{font-weight:100;font-size:46px;line-height:1;width:34px;text-align:center;flex:none;color:#fff}
.rl p{margin:0;font-weight:300;font-size:15px;line-height:1.5;color:#e9e9e9}

/* onboarding */
.ob{max-width:620px;margin:0 auto}
.ob-steps{display:flex;gap:6px;margin:4px 0 22px}
.ob-steps span{flex:1;height:3px;border-radius:3px;background:#2b2b2b}
.ob-steps span.on{background:var(--red)}
.ob h1{font-size:clamp(26px,5vw,36px);margin:0 0 8px;line-height:1.15;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.ob .lead{color:#bdbdbd;font-size:16px;margin:0 0 24px;line-height:1.55;font-weight:300}
.cover{text-align:center;margin:6px 0 26px}
.cover .t{font-size:clamp(34px,8vw,52px);line-height:1.08;text-transform:uppercase;font-weight:700;letter-spacing:.01em}
.cover .t span{display:block;font-weight:200}
.cover svg{margin-top:22px;max-width:62%;height:auto}
.sex{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sexcard{border:1px solid var(--line2);background:#0c0c0c;color:#fff;border-radius:26px;padding:22px 14px 18px;text-align:center;font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;gap:10px}
.sexcard small{font-weight:300;font-size:13px;color:var(--muted);text-transform:none;letter-spacing:0}
.sexcard:hover{border-color:#777}
.sexcard.on{background:#fff;color:#000;border-color:#fff}
.sexcard.on small{color:#555}
.sexcard .ic{width:56px;height:56px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.plist{display:flex;flex-direction:column;gap:8px}
.pgroup{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:20px 0 6px 4px}
.pitem{display:flex;align-items:center;gap:14px;background:#0c0c0c;color:#fff;border:1px solid var(--line);border-radius:22px;padding:12px 16px;cursor:pointer;text-align:left;width:100%}
.pitem.on{border-color:#fff}
.pitem .ck{width:24px;height:24px;border-radius:50%;border:1.5px solid #666;flex:none;display:grid;place-items:center}
.pitem.on .ck{background:var(--red);border-color:var(--red)}
.pitem .tx{flex:1;min-width:0}
.pitem b{display:block;font-size:15px;font-weight:600}
.pitem small{display:block;color:var(--muted);font-size:13px;margin-top:2px;line-height:1.4;font-weight:300}
.pitem .u{font-size:13px;color:var(--muted);font-weight:500}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border:1px solid var(--line2);background:transparent;color:#fff;border-radius:999px;padding:12px 0;font-weight:600;font-size:15px}
.wd.on{background:#fff;border-color:#fff;color:#000}
.ob-nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;align-items:center}

/* input */
.next{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,var(--red),var(--red2));color:#fff;border-radius:24px;padding:16px 20px;margin-bottom:16px}
.next b{font-weight:700}
.next .t{flex:1;font-size:15px;line-height:1.45;font-weight:300}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px 14px}
.mf label{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:13px;font-weight:600;color:#fff;margin:0 4px 3px;text-transform:uppercase;letter-spacing:.04em}
.mf label span{font-size:12px;font-weight:300;color:var(--muted);text-transform:none}
.mf .h{font-size:12px;color:var(--muted);line-height:1.35;margin:0 4px 7px;min-height:16px;font-weight:300}
.mf .iw{position:relative}
.mf .dl{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:700;pointer-events:none}
.dl.good{color:var(--good)}.dl.bad{color:var(--bad)}.dl.neu{color:#888}
.mf .inp{padding-right:74px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.ed{border-collapse:collapse;width:100%;font-size:14px}
table.ed th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px;white-space:nowrap;font-weight:600}
table.ed td{padding:4px 3px;border-top:1px solid var(--line)}
table.ed .inp{padding:7px 12px;font-size:14px;min-width:70px}
table.ed input[type=date].inp{min-width:148px}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-weight:300}
.empty h2{color:#fff}

/* settings metric cards */
.mlist{display:flex;flex-direction:column;gap:10px}
.mcard{border:1px solid var(--line);border-radius:22px;padding:12px;background:#080808}
.mcard.off{opacity:.55}
.mrow1,.mrow2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mrow2{margin-top:10px;gap:10px 16px}
.mrow1 .inp{padding:9px 14px;font-size:15px}
.mrow1 .nm{flex:1 1 160px;font-weight:600}
.mrow1 .un{width:84px;flex:none}
.mrow2 .note{flex:1 1 180px;padding:8px 14px;font-size:14px}
.radio{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:#cfcfcf;cursor:pointer}
.radio input{accent-color:var(--red);width:16px;height:16px}

/* dashboard */
.dtools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 14px}
#dash{background:#000;border:1px solid var(--line);border-radius:28px;padding:32px 30px 22px;max-width:960px;margin:0 auto;position:relative;overflow:hidden}
.d-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.d-brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.06em;font-size:15px;text-transform:uppercase}
.d-pill{background:#fff;color:#000;border-radius:999px;padding:7px 20px;font-weight:700;font-size:16px;white-space:nowrap}
.d-title{font-size:clamp(30px,6vw,54px);font-weight:700;line-height:1.08;margin:26px 0 10px;text-transform:uppercase;letter-spacing:.005em}
.d-title .L{font-weight:200}
.d-range{font-size:clamp(15px,2.3vw,20px);color:#bdbdbd;margin-bottom:24px;font-weight:300}
.hero{background:linear-gradient(125deg,var(--red) 0%,#a3161c 55%,#6e0b0f 100%);color:#fff;border-radius:28px;padding:30px 36px;position:relative;overflow:hidden}
.hero .orn{position:absolute;right:-30px;top:-38px;opacity:.16;pointer-events:none}
.hero-lbl{font-weight:600;letter-spacing:.08em;font-size:14px;color:#ffe9e9;position:relative}
.hero-mid{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:14px 0 22px;position:relative}
.hero-big{font-size:clamp(46px,9vw,80px);font-weight:700;line-height:1;color:#fff;letter-spacing:-.01em}
.hero-big.bad,.hero-pct b.bad{color:#ffd98a}
.hero-pct{text-align:center}
.hero-pct b{display:block;font-size:clamp(26px,4vw,38px);color:#fff;font-weight:700}
.hero-pct span{font-size:14px;color:#ffd9d9;font-weight:300}
.chain{display:flex;align-items:flex-start;flex-wrap:wrap;gap:6px 0;justify-content:space-between;position:relative}
.ch{text-align:center;min-width:92px}
.ch b{display:block;font-size:clamp(16px,2.3vw,22px);font-weight:600;white-space:nowrap}
.ch span{display:block;font-size:14px;color:#ffd0d0;margin-top:7px;font-weight:300}
.ch.last b{background:#fff;color:#000;border-radius:999px;padding:3px 12px;margin:-3px 0}
.ch.last span{color:#fff;font-weight:700}
.arr{font-size:18px;font-weight:300;padding:0 6px;color:#ffd0d0;line-height:1.4}
.hero-foot{border-top:1px solid rgba(255,255,255,.3);margin-top:20px;padding-top:16px;font-weight:600;font-size:clamp(15px,2.1vw,19px);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;position:relative}
.hero-foot .vol{background:#fff;color:#000;border-radius:999px;padding:4px 14px}
.d-h2{font-size:clamp(24px,4vw,34px);font-weight:700;margin:32px 0 6px;text-transform:uppercase}
.d-h2 .L{font-weight:200}
.d-sub{color:var(--muted);font-size:16px;margin-bottom:16px;font-weight:300}
.d-sub b{color:#fff;font-weight:600}
.tblcard{background:#0b0b0b;border:1px solid var(--line);border-radius:26px;padding:8px 20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table.dt{border-collapse:separate;border-spacing:0;width:100%;min-width:560px}
table.dt th{font-size:12px;font-weight:600;letter-spacing:.08em;text-align:center;padding:16px 6px 14px;white-space:nowrap;color:#bdbdbd}
table.dt th:first-child{text-align:left;padding-left:12px}
table.dt td{text-align:center;font-size:20px;color:#a9a9a9;padding:14px 6px;border-top:1px solid #1e1e1e;white-space:nowrap;font-weight:300}
table.dt td.nm{text-align:left;color:#fff;font-weight:600;padding-left:12px;text-transform:uppercase;font-size:16px;letter-spacing:.03em}
.nm .b{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:12px;vertical-align:middle;position:relative;top:-2px}
.nm small{display:block;font-weight:300;font-size:12px;color:var(--muted);margin-left:19px;margin-top:3px;white-space:normal;text-transform:none;letter-spacing:0}
.nm em{font-style:normal;font-weight:300;font-size:12px;color:var(--muted);margin-left:6px;text-transform:none}
table.dt .hl{background:#fff;color:#000;font-weight:700}
table.dt th.hl{border-radius:16px 16px 0 0}
table.dt tr:last-child td.hl{border-radius:0 0 16px 16px}
table.dt tbody tr:first-child td.hl{border-top-color:#e6e6e6}
table.dt td.hl{border-top-color:#e6e6e6}
.pl{display:inline-block;border-radius:999px;padding:8px 12px;font-size:16px;font-weight:700;min-width:100px;white-space:nowrap}
.pl.good{background:var(--good-dbg);color:var(--good-d)}
.pl.bad{background:var(--bad-dbg);color:var(--bad-d)}
.pl.neu{background:var(--neu-dbg);color:var(--neu-d)}
.d-notes{color:var(--muted);font-size:14px;line-height:1.75;margin:16px 0 0;font-weight:300}
.d-foot{border-top:1px solid #222;margin-top:16px;padding-top:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-weight:300}
.d-foot b{letter-spacing:.06em;font-weight:600;color:#cfcfcf}

/* photos */
.phs{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px}
.ph{position:relative;aspect-ratio:3/4;border-radius:22px;border:1.5px dashed #444;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;overflow:hidden;color:var(--muted);font-size:13px;font-weight:500}
.ph:hover{border-color:#888;color:#fff}
.ph .plus{width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:300;line-height:1}
.ph.has{border:0}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .cap{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px}
.ph .x{position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:14px;display:grid;place-items:center}
.ph.busy:after{content:"Сжимаю…";position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.7);color:#fff}
.phcnt{font-size:12px;color:var(--muted);white-space:nowrap}
.phctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:16px}
.phctl .sel{min-width:0}
.phcmp{display:grid;gap:16px}
.pc .pcl{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#bdbdbd;margin:0 0 8px 4px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair figure{margin:0;position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:#111;border:1px solid var(--line)}
.pair img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.pair figcaption{position:absolute;left:10px;bottom:10px;background:#fff;color:#000;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.pair figure.last figcaption{background:var(--red);color:#fff}
.pair .none{position:absolute;inset:0;display:grid;place-items:center;color:#555;font-size:13px;font-weight:300}
.phcmp.three{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.lb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.94);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:88vh;border-radius:16px}
.lb span{position:absolute;top:14px;left:0;right:0;text-align:center;font-weight:600;color:#fff}
@media (max-width:640px){.phgrid{gap:8px}.ph{border-radius:16px}.pair figure{border-radius:16px}.pair{gap:6px}}

@media (max-width:640px){
 .wrap{padding:12px 10px calc(96px + env(safe-area-inset-bottom))}
 .bar{margin-bottom:14px}
 .brand{font-size:14px}
 .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:0;border:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(0,0,0,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
 .tab{flex:1;flex-direction:column;gap:3px;font-size:11px;padding:7px 4px;border-radius:16px}
 .tab.on{background:#fff;color:#000}
 .savebox .stx{display:none}
 .panel{padding:18px 14px;border-radius:22px}

<body>
<div id="root"></div>
<noscript><p style="padding:20px">Для работы калькулятора включите JavaScript.</p></noscript>
<script>
(function(){
'use strict';

/* ================= справочник параметров ================= */
// g — «хорошо, когда» по умолчанию; gm — особое значение для мужчин
var CAT={
  weight:{n:'Вес',u:'кг',g:'down',h:'Утром натощак, после туалета, в одной и той же одежде'},
  neck:{n:'Шея',u:'см',g:'down',h:'В самом узком месте шеи'},
  chest:{n:'Грудь',u:'см',g:'down',h:'По самым выступающим точкам, лента горизонтально'},
  underbust:{n:'Под грудью',u:'см',g:'down',h:'Сразу под грудью, лента горизонтально'},
  shoulders:{n:'Плечи',u:'см',g:'down',gm:'up',h:'По самым выступающим точкам плеч'},
  arm:{n:'Рука',u:'см',g:'down',gm:'up',h:'Самое широкое место плеча, рука опущена и расслаблена'},
  arm_r:{n:'Правая рука',u:'см',g:'down',h:'Самое широкое место плеча, рука расслаблена'},
  arm_l:{n:'Левая рука',u:'см',g:'down',h:'Самое широкое место плеча, рука расслаблена'},
  forearm:{n:'Предплечье',u:'см',g:'down',gm:'up',h:'Самое широкое место ниже локтя'},
  waist:{n:'Талия',u:'см',g:'down',h:'Самое узкое место, на спокойном выдохе, живот не втягивать'},
  belly:{n:'Живот',u:'см',g:'down',h:'По линии пупка, на спокойном выдохе'},
  hips:{n:'Бёдра',u:'см',g:'down',h:'По самым выступающим точкам ягодиц, стопы вместе'},
  thigh:{n:'Нога',u:'см',g:'down',h:'Самое широкое место бедра, сразу под ягодицей'},
  thigh_r:{n:'Правое бедро',u:'см',g:'down',h:'Самое широкое место бедра, сразу под ягодицей'},
  thigh_l:{n:'Левое бедро',u:'см',g:'down',h:'Самое широкое место бедра, сразу под ягодицей'},
  calf:{n:'Икра',u:'см',g:'down',h:'Самое широкое место икры, стоя'},
  calf_r:{n:'Правая голень',u:'см',g:'down',h:'Самое широкое место икры, стоя'},
  calf_l:{n:'Левая голень',u:'см',g:'down',h:'Самое широкое место икры, стоя'},
  fat:{n:'% жира',u:'%',g:'down',h:'Всегда одним и тем же способом (весы или калипер)'},
  muscle:{n:'Мышечная масса',u:'кг',g:'up',h:'По умным весам, в одно и то же время'},
  pulse:{n:'Пульс в покое',u:'уд/мин',g:'down',h:'Утром сразу после пробуждения, лёжа'}
};
var ORDER=['weight','neck','chest','underbust','shoulders','arm','arm_r','arm_l','forearm','waist','belly','hips','thigh','thigh_r','thigh_l','calf','calf_r','calf_l','fat','muscle','pulse'];
var SETS={
  f:{base:['weight','neck','chest','arm_r','arm_l','waist','hips','thigh_r','thigh_l','calf_r','calf_l'],extra:['underbust','belly','shoulders','forearm','fat','muscle','pulse']},
  m:{base:['weight','chest','arm','waist','hips','thigh','calf'],extra:['neck','belly','shoulders','forearm','fat','muscle','pulse']}
};
function goalFor(key,sex){var c=CAT[key];return sex==='m'&&c.gm?c.gm:c.g}

/* ================= утилиты ================= */
var KEY='zamery-calc-v2';
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(s){s=String(s==null?'':s).trim().replace(/\s/g,'').replace(',','.');if(s==='')return null;var n=parseFloat(s);return isFinite(n)&&/^-?\d*\.?\d+$/.test(s)?n:null}
function r1(n){return Math.round(n*10)/10}
function fmt(n){if(n==null)return '—';return String(r1(n)).replace('.',',').replace('-','−')}
function inVal(n){return n==null?'':String(n).replace('.',',')}
function signed(d,unit,fixed){var r=r1(d);var s=fixed?Math.abs(r).toFixed(1):String(Math.abs(r));s=s.replace('.',',');return (r>0?'+':r<0?'−':'')+s+(unit?' '+unit:'')}
function pD(s){return new Date(s+'T00:00:00')}
function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function today(){return iso(new Date())}
function dm(s){return s.slice(8,10)+'.'+s.slice(5,7)}
function days(a,b){return Math.round((pD(b)-pD(a))/864e5)}
var MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var WDS=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
var WDPO=['по воскресеньям','по понедельникам','по вторникам','по средам','по четвергам','по пятницам','по субботам'];
var WDN=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
function longD(s,withYear){var d=pD(s);return d.getDate()+' '+MG[d.getMonth()]+(withYear?' '+d.getFullYear():'')}
function plural(n,a,b,c){n=Math.abs(n)%100;var m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c}
var WW={1:'неделю',2:'две недели',3:'три недели',4:'четыре недели',5:'пять недель',6:'шесть недель',7:'семь недель',8:'восемь недель',9:'девять недель',10:'десять недель',11:'одиннадцать недель',12:'двенадцать недель'};
function autoTitle(E){if(E.length<2)return 'Первый замер';var d=days(E[0].date,E[E.length-1].date);if(d<7)return 'Замеры за '+d+' '+plural(d,'день','дня','дней');var w=Math.round(d/7);return 'Замеры за '+(WW[w]||w+' '+plural(w,'неделю','недели','недель'))}
function cls(d,goal){var r=r1(d);if(r===0||goal==='none')return 'neu';if(goal==='up')return r>0?'good':'bad';return r<0?'good':'bad'}
function val(e,id){var v=e&&e.v[id];return typeof v==='number'?v:null}
function nextDay(wd){var d=new Date();d.setHours(0,0,0,0);var diff=(wd-d.getDay()+7)%7;d.setDate(d.getDate()+diff);return {date:iso(d),diff:diff}}
function slug(s){return String(s).toLowerCase().replace(/[^a-zа-яё0-9]+/gi,'-').replace(/^-|-$/g,'')||'data'}

/* ================= состояние ================= */
var storageOk=true;
try{localStorage.setItem('zamery-t','1');localStorage.removeItem('zamery-t')}catch(e){storageOk=false}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
var state=load()||{v:2,activeId:null,window:0,hints:true,people:[]};
fixState();

function newPerson(){return{id:uid(),name:'',sex:'',weekday:new Date().getDay(),setup:false,title:'',footer:'По вашим замерам',metrics:[],entries:[]}}
function fixState(){
  if(!state||!Array.isArray(state.people))state={v:2,people:[]};
  state.v=2;if(state.hints==null)state.hints=true;state.window=+state.window||0;
  if(!state.people.length){var p=newPerson();state.people=[p];state.activeId=p.id}
  if(!state.people.some(function(p){return p.id===state.activeId}))state.activeId=state.people[0].id;
  state.people.forEach(function(p){
    p.id=p.id||uid();p.metrics=Array.isArray(p.metrics)?p.metrics:[];p.entries=Array.isArray(p.entries)?p.entries:[];
    if(p.setup==null)p.setup=p.metrics.length>0;   // данные из старой версии
    if(p.sex==null)p.sex='';if(p.weekday==null)p.weekday=1;if(p.footer==null)p.footer='По вашим замерам';if(p.title==null)p.title='';if(p.name==null)p.name='';
    p.metrics.forEach(function(m){m.id=m.id||uid();if(m.show==null)m.show=true;if(!m.goal)m.goal='down';if(m.unit==null)m.unit='';if(m.note==null)m.note=''});
    p.entries=p.entries.filter(function(e){return e&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)});
    p.entries.forEach(function(e){e.v=e.v||{}});sortEntries(p);
  });
}
function sortEntries(p){p.entries.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0})}
function P(){for(var i=0;i<state.people.length;i++)if(state.people[i].id===state.activeId)return state.people[i];return state.people[0]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOk=true}catch(e){storageOk=false}renderBar()}
function winEntries(p){var n=state.window;return n?p.entries.slice(-n):p.entries.slice()}
function metricFromKey(key,sex){var c=CAT[key];return{id:uid(),key:key,name:c.n,unit:c.u,goal:goalFor(key,sex),note:'',show:true}}
function hintOf(m){return m.key&&CAT[m.key]?CAT[m.key].h:''}

/* ================= ui-состояние ================= */
var VIEWS=['dash','input','params'];
var view=VIEWS.indexOf(location.hash.slice(1))>=0?location.hash.slice(1):'dash';
var ob=null; // черновик онбординга
var armed=null,armTimer=null,newDraft={},newDate='',justAdded=false,msg={input:'',params:'',dash:''},msgErr={};
var root=document.getElementById('root');

function KOK(w,id){var u='g'+(id||uid());var d='';for(var i=0;i<=12;i++){var a=Math.PI*(1-i/12),x=100+66*Math.cos(a),y=118-82*Math.sin(a);d+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(i%2?2.6:4.2)+'" fill="#e8c77d"/>'}
  for(var j=1;j<12;j+=2){var b=Math.PI*(1-j/12),x2=100+52*Math.cos(b),y2=118-64*Math.sin(b);d+='<path d="M'+(x2-6).toFixed(1)+' '+y2.toFixed(1)+'q6 -9 12 0q-6 9 -12 0z" fill="#e8c77d" opacity=".9"/>'}
  return '<svg width="'+w+'" viewBox="0 0 200 150" aria-hidden="true"><defs><radialGradient id="'+u+'" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#ef3a3f"/><stop offset="1" stop-color="#9e1016"/></radialGradient></defs><path d="M10 146C10 52 58 6 100 6s90 46 90 140h-46c0-42-18-64-44-64s-44 22-44 64z" fill="url(#'+u+')" stroke="#e8c77d" stroke-width="4"/>'+d+'<circle cx="100" cy="20" r="6" fill="#fff" stroke="#e8c77d" stroke-width="2"/></svg>'}
var LOGO=KOK(30,'logo');
var IC={
  dash:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  input:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  params:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>'
};
var CHECK='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var FIG={
  f:'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="9" r="5"/><path d="M12 14v8M8.5 18.5h7"/></svg>',
  m:'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="14" r="5"/><path d="M13.6 10.4L20 4M15 4h5v5"/></svg>'
};

/* ================= рендер ================= */
function render(){
  var p=P();
  var h='<div class="wrap"><div class="bar" id="bar"></div>';
  if(!p.setup)h+=obView();
  else if(view==='dash')h+=dashView(p);else if(view==='input')h+=inputView(p);else h+=paramsView(p);
  root.innerHTML=h+'</div>';renderBar();
}
function sexWord(p){return p.sex==='f'?'женщина':p.sex==='m'?'мужчина':'тела'}
function renderBar(){
  var b=document.getElementById('bar');if(!b)return;
  var p=P();
  var ppl=state.people.length>1&&p.setup?'<select class="sel" data-f="person" aria-label="Человек">'+state.people.map(function(x){return '<option value="'+x.id+'"'+(x.id===p.id?' selected':'')+'>'+esc(x.name||'Без имени')+'</option>'}).join('')+'</select>':'';
  var st=storageOk?'Сохранено на этом устройстве':'Браузер не даёт сохранять — сделайте резервную копию';
  var tabs=p.setup?'<nav class="tabs">'+[['dash','Дашборд'],['input','Замер'],['params','Настройки']].map(function(t){return '<button class="tab'+(view===t[0]?' on':'')+'" data-act="tab" data-v="'+t[0]+'">'+IC[t[0]]+'<span>'+t[1]+'</span></button>'}).join('')+'</nav>':'';
  b.innerHTML='<div class="brand"><span class="logo">'+LOGO+'</span><span>Замеры <span class="L">'+sexWord(p)+'</span></span></div>'+ppl+tabs+
    (p.setup?'<div class="savebox" title="'+esc(st)+'"><span class="dot'+(storageOk?'':' err')+'"></span><span class="stx">'+st+'</span></div>':'');
}

/* ---------- онбординг ---------- */
function startOb(){var p=P();ob={step:1,sex:p.sex||'',name:p.name||'',keys:{},custom:[],weekday:p.weekday!=null?p.weekday:new Date().getDay(),customName:''};if(ob.sex)SETS[ob.sex].base.forEach(function(k){ob.keys[k]=true})}
function obView(){
  if(!ob)startOb();
  var steps='<div class="ob-steps">'+[1,2,3].map(function(i){return '<span class="'+(i<=ob.step?'on':'')+'"></span>'}).join('')+'</div>';
  var h='<div class="ob">'+steps;
  var canBack=ob.step>1||state.people.filter(function(x){return x.setup}).length>0;
  if(ob.step===1){
    h+='<div class="cover"><div class="t">Замеры<span>'+(ob.sex==='f'?'женщины':ob.sex==='m'?'мужчины':'тела')+'</span></div>'+KOK(260,'cov')+'</div>';
    h+='<p class="lead" style="text-align:center">Настройка займёт меньше минуты. Все данные и фото хранятся только у вас на устройстве.</p>';
    h+='<div class="lbl">Кто будет замеряться</div><div class="sex">'+
      [['f','Женщина','11 замеров по схеме'],['m','Мужчина','7 замеров по схеме']].map(function(s){return '<button class="sexcard'+(ob.sex===s[0]?' on':'')+'" data-act="obSex" data-v="'+s[0]+'"><span class="ic">'+FIG[s[0]]+'</span>'+s[1]+'<small>'+s[2]+'</small></button>'}).join('')+'</div>';
    h+='<div class="fld" style="margin-top:20px"><label for="obname">Имя (необязательно)</label><input class="inp" id="obname" data-f="obname" value="'+esc(ob.name)+'" placeholder="Например, Анна" autocomplete="given-name"></div>';
    h+='<div class="ob-nav">'+(canBack?'<button class="btn ghost" data-act="obCancel">Отмена</button>':'<span></span>')+'<button class="btn pri big" data-act="obNext"'+(ob.sex?'':' disabled')+'>Дальше</button></div>';
  }else if(ob.step===2){
    var S=SETS[ob.sex];
    h+='<h1>Что <span class="L">будем измерять?</span></h1><p class="lead">Основные замеры уже отмечены по схеме. Добавьте то, что важно именно вам, — всё отмеченное появится на дашборде. Изменить можно в любой момент.</p>';
    h+='<div class="pgroup">Основные замеры</div><div class="plist">'+S.base.map(pItem).join('')+'</div>';
    h+='<div class="pgroup">Дополнительно</div><div class="plist">'+S.extra.map(pItem).join('')+'</div>';
    h+='<div class="pgroup">Свои проблемные зоны</div><div class="plist">'+ob.custom.map(function(c,i){return '<button class="pitem on" data-act="obDelCustom" data-i="'+i+'"><span class="ck">'+CHECK+'</span><span class="tx"><b>'+esc(c)+'</b><small>Нажмите, чтобы убрать</small></span><span class="u">см</span></button>'}).join('')+'</div>';
    h+='<div class="row" style="display:flex;gap:8px;margin-top:8px"><input class="inp" data-f="obcustom" id="obcustom" value="'+esc(ob.customName)+'" placeholder="Например, над коленом" style="flex:1"><button class="btn" data-act="obAddCustom">Добавить</button></div>';
    var cnt=Object.keys(ob.keys).filter(function(k){return ob.keys[k]}).length+ob.custom.length;
    h+='<div class="ob-nav"><button class="btn ghost" data-act="obBack">Назад</button><button class="btn pri big" data-act="obNext"'+(cnt?'':' disabled')+'>Дальше · '+cnt+' '+plural(cnt,'замер','замера','замеров')+'</button></div>';
  }else{
    h+='<h1>День <span class="L">замеров</span></h1><p class="lead">Замеры делают раз в неделю, в один и тот же день — обычно в день недели, когда вы начали. Так динамика будет честной.</p>';
    h+='<div class="wdays">'+[1,2,3,4,5,6,0].map(function(d){return '<button class="wd'+(ob.weekday===d?' on':'')+'" data-act="obWd" data-v="'+d+'">'+WDS[d]+'</button>'}).join('')+'</div>';
    h+='<p class="hint" style="margin-top:10px">Замеры '+WDPO[ob.weekday]+'. Приложение подскажет дату следующего замера.</p>';
    h+=rulesBlock(true);
    h+='<div class="ob-nav"><button class="btn ghost" data-act="obBack">Назад</button><button class="btn pri big" data-act="obDone">Готово — внести замер</button></div>';
  }
  return h+'</div>';
}
function pItem(k){var c=CAT[k],on=!!ob.keys[k];return '<button class="pitem'+(on?' on':'')+'" data-act="obToggle" data-k="'+k+'" aria-pressed="'+on+'"><span class="ck">'+(on?CHECK:'')+'</span><span class="tx"><b>'+c.n+'</b><small>'+c.h+'</small></span><span class="u">'+c.u+'</span></button>'}
function rulesBlock(open){
  var R=['Раз в неделю, в один и тот же день недели, утром строго натощак.','Вес — после туалета, до еды и воды, в одной и той же одежде.','Лента прилегает плотно, но не сдавливает кожу, и идёт параллельно полу. Живот не втягивайте.','Мерьте каждый раз в одних и тех же точках и отдельно отслеживайте свои проблемные зоны.','Фото — при одном свете, в одной позе и одежде, на одинаковом расстоянии.'];
  return '<details class="rules"'+(open?' open':'')+'><summary>Как правильно делать замеры</summary>'+R.map(function(t,i){return '<div class="rl"><span class="n">'+(i+1)+'</span><p>'+t+'</p></div>'}).join('')+'</details>';
}

/* ---------- дашборд ---------- */
var shareSupported=false;
try{shareSupported=!!(navigator.canShare&&navigator.canShare({files:[new File([new Blob(['x'])],'t.png',{type:'image/png'})]}))}catch(e){}
var copySupported=!!(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write);

function dashView(p){
  var E=winEntries(p);
  var tools='<div class="dtools">'+
    (shareSupported?'<button class="btn pri" data-act="share">Поделиться картинкой</button>':'')+
    (copySupported&&!shareSupported?'<button class="btn pri" data-act="copyimg">Скопировать картинку</button>':'')+
    '<button class="btn" data-act="png">Скачать PNG</button>'+

root.addEventListener('click',function(ev){

  if(a==='obNext'){if(ob.step===1&&!ob.sex)return;ob.step++;render();window.scrollTo(0,0);return}
  if(a==='obBack'){if(ob.step>1)ob.step--;render();window.scrollTo(0,0);return}

    if(!p.setup&&!p.entries.length)state.people=state.people.filter(function(x){return x!==p});

    var keep={};p.metrics.forEach(function(m){if(m.key)keep[m.key]=m});
    var ms=ORDER.filter(function(k){return ob.keys[k]}).map(function(k){return keep[k]||metricFromKey(k,ob.sex)});

    ob.custom.forEach(function(c){ms.push({id:uid(),name:c,unit:'см',goal:'down',note:'',show:true})});
    if(!ms.some(function(m){return m.main})){var w=ms.filter(function(m){return m.key==='weight'})[0];if(w)w.main=true}
    p.metrics=ms;p.sex=ob.sex;p.name=(ob.name||'').trim();p.weekday=ob.weekday;p.setup=true;ob=null;
    newDraft={};newDate='';justAdded=false;persist();go('input');return}
  // основное
  if(a==='tab'){justAdded=false;go(b.getAttribute('data-v'));return}
  if(a==='addEntry'){
    var vals={},bad=null;
    p.metrics.forEach(function(m){var raw=newDraft[m.id];if(raw==null||String(raw).trim()==='')return;var n=num(raw);if(n==null)bad=bad||m.name;else vals[m.id]=n});
    if(bad){say('input','Не похоже на число: '+bad,true);return}
    if(!newDate){say('input','Укажите дату',true);return}
    if(!Object.keys(vals).length){say('input','Заполните хотя бы одно значение',true);var f1=root.querySelector('[data-n]:not([data-n="__date"])');if(f1)f1.focus();return}
    var e=null;p.entries.forEach(function(x){if(x.date===newDate)e=x});
    if(e){for(var kk in vals)e.v[kk]=vals[kk]}else{p.entries.push({date:newDate,v:vals});sortEntries(p)}
    var txt=(e?'Замер за '+dm(newDate)+' обновлён':'Замер за '+dm(newDate)+' сохранён')+' ✓';
    newDraft={};justAdded=true;persist();say('input',txt);return}
  if(a==='phDel'){ev.preventDefault();var dk=phKey(p.id,newDate||today(),b.getAttribute('data-s'));phDelKeys([dk]).then(render,function(){say('input','Не удалось удалить фото',true)});return}
  if(a==='phView'){var u=PH.url[b.getAttribute('data-k')];if(!u)return;var lb=document.createElement('div');lb.className='lb';lb.innerHTML='<span>'+esc(b.getAttribute('data-c')||'')+'</span><img src="'+u+'" alt="">';lb.onclick=function(){lb.remove()};document.body.appendChild(lb);return}
  if(a==='delEntry'){var d=b.getAttribute('data-d');if(armed!=='e:'+d){arm('e:'+d);return}
    phDelKeys(phKeysWhere(p.id+'|'+d+'|'));p.entries=p.entries.filter(function(x){return x.date!==d});armed=null;persist();render();return}
  if(a==='addMetric'){p.metrics.push({id:uid(),name:'Новый параметр',unit:'см',goal:'down',note:'',show:true});persist();render();var ins=root.querySelectorAll('[data-k="name"]');if(ins.length){ins[ins.length-1].focus();ins[ins.length-1].select()}return}
  if(a==='preset'){var key=b.getAttribute('data-k');var m=metricFromKey(key,p.sex);if(key==='weight'&&!p.metrics.some(function(q){return q.main}))m.main=true;
    // ставим на «своё» место по общему порядку
    var pos=p.metrics.length;for(var i=0;i<p.metrics.length;i++){var mk=p.metrics[i].key;if(mk&&ORDER.indexOf(mk)>ORDER.indexOf(key)){pos=i;break}}
    p.metrics.splice(pos,0,m);persist();render();return}
  if(a==='noMain'){p.metrics.forEach(function(m){delete m.main});persist();render();return}
  if(a==='delMetric'){var id=b.getAttribute('data-m');if(armed!=='m:'+id){arm('m:'+id);return}
    p.metrics=p.metrics.filter(function(m){return m.id!==id});p.entries.forEach(function(e){delete e.v[id]});armed=null;persist();render();return}
  if(a==='mv'){var id2=b.getAttribute('data-m'),dir=+b.getAttribute('data-dir'),ix=-1;p.metrics.forEach(function(m,j){if(m.id===id2)ix=j});var j=ix+dir;if(ix<0||j<0||j>=p.metrics.length)return;var t=p.metrics[ix];p.metrics[ix]=p.metrics[j];p.metrics[j]=t;persist();render();return}
  if(a==='psex'){p.sex=b.getAttribute('data-v');persist();render();return}
  if(a==='pwd'){p.weekday=+b.getAttribute('data-v');persist();render();return}
  if(a==='addPerson'){var np=newPerson();state.people.push(np);state.activeId=np.id;ob=null;persist();render();window.scrollTo(0,0);return}
  if(a==='delPerson'){if(armed!=='person'){arm('person');return}phDelKeys(phKeysWhere(p.id+'|'));state.people=state.people.filter(function(x){return x.id!==p.id});state.activeId=state.people[0].id;armed=null;persist();render();return}
  if(a==='reset'){if(armed!=='reset'){arm('reset');return}phDelKeys(Object.keys(PH.blob));armed=null;state={v:2,people:[]};fixState();ob=null;persist();go('dash');return}
  if(a==='backup'){var ks=Object.keys(PH.blob);Promise.all(ks.map(function(k){return blobToData(PH.blob[k])})).then(function(ds){
      var out=JSON.parse(JSON.stringify(state));out.photos={};ks.forEach(function(k,i){out.photos[k]=ds[i]});
      download(new Blob([JSON.stringify(out)],{type:'application/json'}),'zamery-backup-'+today()+'.json');say('params','Резервная копия скачана'+(ks.length?' (вместе с фото: '+ks.length+')':''))});return}
  if(a==='csv'){download(new Blob(['﻿'+toCSV(p)],{type:'text/csv;charset=utf-8'}),'zamery-'+slug(p.name||'moi')+'.csv');return}
  if(a==='png'){if(!window.html2canvas){say('dash','Модуль картинок ещё не загрузился — проверьте интернет и попробуйте снова',true);return}
    snap().then(function(blob){download(blob,fileName())},function(){say('dash','Не удалось сделать картинку',true)});return}
  if(a==='share'){if(!window.html2canvas){say('dash','Модуль картинок ещё не загрузился — попробуйте через пару секунд',true);return}
    snap().then(function(blob){var file=new File([blob],fileName(),{type:'image/png'});
      return navigator.share({files:[file],title:'Мои замеры'}).catch(function(e){if(e&&e.name==='AbortError')return;download(blob,fileName())})},function(){say('dash','Не удалось сделать картинку',true)});return}
  if(a==='copyimg'){if(!window.html2canvas||!copySupported){say('dash','Этот браузер не умеет копировать картинки — используйте «Скачать PNG»',true);return}
    try{navigator.clipboard.write([new ClipboardItem({'image/png':snap()})]).then(function(){say('dash','Картинка скопирована — вставьте её в мессенджер или письмо')},function(){say('dash','Браузер не дал скопировать — используйте «Скачать PNG»',true)})}catch(e){say('dash','Браузер не дал скопировать — используйте «Скачать PNG»',true)}return}
});

root.addEventListener('input',function(ev){
  var t=ev.target,n=t.getAttribute('data-n'),f=t.getAttribute('data-f');
  if(n&&n!=='__date'){newDraft[n]=t.value;justAdded=false;updateDelta(t);return}
  if(f==='obname'&&ob){ob.name=t.value;return}
  if(f==='obcustom'&&ob){ob.customName=t.value;return}
});
root.addEventListener('keydown',function(ev){
  var t=ev.target;if(ev.key!=='Enter')return;
  if(t.getAttribute('data-f')==='obcustom'){ev.preventDefault();var b=root.querySelector('[data-act="obAddCustom"]');if(b)b.click();return}
  var n=t.getAttribute('data-n');if(!n||n==='__date')return;
  ev.preventDefault();
  var all=Array.prototype.slice.call(root.querySelectorAll('[data-n]:not([data-n="__date"])')),i=all.indexOf(t);
  if(i>=0&&i<all.length-1){all[i+1].focus()}else{var s=root.querySelector('[data-act="addEntry"]');if(s)s.click()}
});
root.addEventListener('change',function(ev){
  var t=ev.target,f=t.getAttribute('data-f'),p=P();
  if(t.getAttribute('data-n')==='__date'){newDate=t.value||today();justAdded=false;render();return}
  if(!f)return;
  if(f==='phfile'){var pf=t.files&&t.files[0],slot=t.getAttribute('data-s');if(!pf)return;var dte=newDate||today();PH.busy=slot;render();
    compress(pf).then(function(bl){return phPut(phKey(p.id,dte,slot),bl)}).then(function(){PH.busy='';
      if(!p.entries.some(function(e){return e.date===dte})){p.entries.push({date:dte,v:{}});sortEntries(p);persist()}render()},
      function(){PH.busy='';say('input','Не получилось сохранить фото'+(PH.ok?'':' — браузер запрещает хранение'),true)});return}
  if(f==='phA'){phA=t.value;render();return}
  if(f==='phB'){phB=t.value;render();return}
  if(f==='phInDash'){state.photoInDash=t.checked;persist();render();return}
  if(f==='impfile'){var file=t.files&&t.files[0];if(!file)return;var rd=new FileReader();rd.onload=function(){try{var s=JSON.parse(rd.result);if(!s||!Array.isArray(s.people))throw 0;var phs=s.photos||{};delete s.photos;state=s;fixState();ob=null;persist();
      phDelKeys(Object.keys(PH.blob)).then(function(){return Promise.all(Object.keys(phs).map(function(k){return phPut(k,dataToBlob(phs[k]))}))}).then(render,function(){say('params','Замеры загружены, но фото сохранить не удалось',true)});say('params','Данные из файла загружены.')}catch(e){say('params','Это не похоже на файл резервной копии',true)}};rd.readAsText(file);return}
  if(f==='person'){state.activeId=t.value;newDraft={};newDate='';justAdded=false;ob=null;persist();render();return}
  if(f==='window'){state.window=+t.value;persist();render();return}
  if(f==='hints'){state.hints=t.checked;persist();render();return}
  if(f==='pname'){p.name=t.value.trim();persist();return}
  if(f==='ptitle'){p.title=t.value.trim();persist();return}
  if(f==='pfooter'){p.footer=t.value.trim();persist();return}
  if(f==='main'){p.metrics.forEach(function(m){if(m.id===t.value)m.main=true;else delete m.main});persist();return}
  if(f==='show'){var id0=t.getAttribute('data-m');p.metrics.forEach(function(m){if(m.id===id0)m.show=t.checked});persist();var c=t.closest('.mcard');if(c)c.classList.toggle('off',!t.checked);return}
  if(f==='m'){var id=t.getAttribute('data-m'),k=t.getAttribute('data-k');p.metrics.forEach(function(m){if(m.id===id)m[k]=k==='name'?(t.value.trim()||'Без названия'):t.value.trim()});persist();return}
  if(f==='hv'){var d=t.getAttribute('data-d'),mid=t.getAttribute('data-m'),v=num(t.value);
    if(t.value.trim()!==''&&v==null){t.style.borderColor='#b4412f';return}t.style.borderColor='';
    p.entries.forEach(function(e){if(e.date===d){if(v==null)delete e.v[mid];else e.v[mid]=v}});
    t.value=inVal(v);persist();return}
  if(f==='hd'){var od=t.getAttribute('data-d'),nd=t.value;if(!nd){t.value=od;return}
    if(nd!==od&&p.entries.some(function(e){return e.date===nd})){t.value=od;say('input','Замер за '+dm(nd)+' уже есть',true);return}
    p.entries.forEach(function(e){if(e.date===od)e.date=nd});sortEntries(p);persist();phMoveDate(p.id,od,nd).then(render);render();return}
});

/* ================= фото (IndexedDB, только на устройстве) ================= */
var SLOTS=[['front','Спереди'],['side','Сбоку'],['back','Сзади']];
var PH={db:null,blob:{},url:{},ok:true,busy:''};
var phA='',phB='';
function phKey(pid,date,slot){return pid+'|'+date+'|'+slot}
function phUrl(p,date,slot){return PH.url[phKey(p.id,date,slot)]||''}
function phCount(p,date){var n=0;SLOTS.forEach(function(sl){if(phUrl(p,date,sl[0]))n++});return n}
function idb(){return new Promise(function(res,rej){if(PH.db)return res(PH.db);var r;try{r=indexedDB.open('zamery-photos',1)}catch(e){return rej(e)}
  r.onupgradeneeded=function(){r.result.createObjectStore('p')};r.onsuccess=function(){PH.db=r.result;res(PH.db)};r.onerror=function(){rej(r.error)}})}
function phTx(fn){return idb().then(function(db){return new Promise(function(res,rej){var t=db.transaction('p','readwrite');fn(t.objectStore('p'));t.oncomplete=function(){res()};t.onerror=t.onabort=function(){rej(t.error)}})})}
function setUrl(k,b){if(PH.url[k])URL.revokeObjectURL(PH.url[k]);PH.blob[k]=b;PH.url[k]=URL.createObjectURL(b)}
function dropUrl(k){if(PH.url[k])URL.revokeObjectURL(PH.url[k]);delete PH.url[k];delete PH.blob[k]}
function phPut(k,b){return phTx(function(st){st.put(b,k)}).then(function(){setUrl(k,b)})}
function phDelKeys(keys){if(!keys.length)return Promise.resolve();return phTx(function(st){keys.forEach(function(k){st.delete(k)})}).then(function(){keys.forEach(dropUrl)})}
function phKeysWhere(pre){return Object.keys(PH.blob).filter(function(k){return k.indexOf(pre)===0})}
function phMoveDate(pid,od,nd){var ps=[];SLOTS.forEach(function(sl){var a=phKey(pid,od,sl[0]),b=PH.blob[a];if(b)ps.push(phPut(phKey(pid,nd,sl[0]),b).then(function(){return phDelKeys([a])}))});return Promise.all(ps)}
function phLoadAll(){return idb().then(function(db){return new Promise(function(res){var c=db.transaction('p','readonly').objectStore('p').openCursor();
  c.onsuccess=function(){var cur=c.result;if(cur){setUrl(cur.key,cur.value);cur.continue()}else res()};c.onerror=function(){res()}})},function(){PH.ok=false})}
function compress(file){return new Promise(function(res,rej){var img=new Image(),u=URL.createObjectURL(file);
  img.onload=function(){var M=1280,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,M/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error('blob'))},'image/jpeg',.82)};
  img.onerror=function(){URL.revokeObjectURL(u);rej(new Error('img'))};img.src=u})}
function blobToData(b){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result)};r.readAsDataURL(b)})}
function dataToBlob(d){var i=d.indexOf(','),bin=atob(d.slice(i+1)),a=new Uint8Array(bin.length);for(var j=0;j<bin.length;j++)a[j]=bin.charCodeAt(j);return new Blob([a],{type:(d.slice(5,i).split(';')[0])||'image/jpeg'})}
function photoDates(p,E){return E.filter(function(e){return phCount(p,e.date)>0}).map(function(e){return e.date})}
function photoCompare(p,dates){
  var a=dates.indexOf(phA)>=0?phA:dates[0],b=dates.indexOf(phB)>=0?phB:dates[dates.length-1];
  var cols=SLOTS.filter(function(sl){return phUrl(p,a,sl[0])||phUrl(p,b,sl[0])});
  var fig=function(d,sl,last){var u=phUrl(p,d,sl[0]);return '<figure'+(last?' class="last"':'')+'>'+(u?'<img src="'+u+'" alt="" data-act="phView" data-k="'+esc(phKey(p.id,d,sl[0]))+'" data-c="'+esc(sl[1]+' · '+dm(d))+'">':'<div class="none">нет фото</div>')+'<figcaption>'+dm(d)+'</figcaption></figure>'};
  return '<div class="phcmp'+(cols.length>1?' three':'')+'">'+cols.map(function(sl){return '<div class="pc"><div class="pcl">'+sl[1]+'</div><div class="pair">'+fig(a,sl,false)+(a!==b?fig(b,sl,true):'')+'</div></div>'}).join('')+'</div>';
}
function photoSection(p,E){
  var dates=photoDates(p,E);if(!dates.length)return '';
  return '<div class="d-h2">Фото <span class="L">прогресс</span></div><div class="d-sub">'+(dates.length>1?'Было и стало: сравнение по датам':'Пока одно фото — добавьте следующее в день замеров')+'</div>'+photoCompare(p,dates);
}
function photoPanel(p,E){
  var dates=photoDates(p,E);
  var h='<div class="panel" style="max-width:960px;margin:16px auto 0"><h2>Фото <span class="L">прогресс</span></h2>';
  if(!dates.length)return h+'<p class="sub" style="margin:0">Прикрепляйте фото к замерам на вкладке «Замер» — здесь можно будет сравнить «было» и «стало». Фото хранятся только на этом устройстве.</p></div>';
  var a=dates.indexOf(phA)>=0?phA:dates[0],b=dates.indexOf(phB)>=0?phB:dates[dates.length-1];
  var opt=function(cur){return dates.map(function(d){return '<option value="'+d+'"'+(d===cur?' selected':'')+'>'+longD(d,true)+'</option>'}).join('')};
  h+='<div class="phctl"><span class="hint">Сравнить</span><select class="sel" data-f="phA">'+opt(a)+'</select><span class="hint">и</span><select class="sel" data-f="phB">'+opt(b)+'</select>'+
    '<label class="switch"><input type="checkbox" data-f="phInDash"'+(state.photoInDash?' checked':'')+'><i></i>Добавить фото в картинку дашборда</label></div>';
  if(!state.photoInDash)h+=photoCompare(p,dates);else h+='<p class="hint" style="margin:0">Фото показаны в дашборде выше и попадут в картинку.</p>';
  return h+'</div>';
}

/* ================= файлы и картинки ================= */
function download(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000)}
function fileName(){return 'zamery-'+slug(P().name||'moi')+'-'+today()+'.png'}
function toCSV(p){
  var q=function(s){s=String(s);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  var rows=[['Дата'].concat(p.metrics.map(function(m){return m.name+(m.unit?' ('+m.unit+')':'')}))];
  p.entries.forEach(function(e){rows.push([dm(e.date)+'.'+e.date.slice(0,4)].concat(p.metrics.map(function(m){return inVal(val(e,m.id))})))});
  return rows.map(function(r){return r.map(q).join(';')}).join('\r\n');
}
function snap(){
  var el=document.getElementById('dash'),tc=el.querySelector('.tblcard');
  var extra=tc?Math.max(0,tc.scrollWidth-tc.clientWidth):0,w=el.offsetWidth+extra;
  el.classList.add('snapping');if(extra){el.style.width=w+'px';el.style.maxWidth='none';tc.style.overflow='visible'}
  var done=function(){el.classList.remove('snapping');el.style.width='';el.style.maxWidth='';if(tc)tc.style.overflow=''};
  return html2canvas(el,{scale:2,backgroundColor:'#000000',useCORS:true,logging:false,windowWidth:Math.max(document.documentElement.clientWidth,w+40)})
    .then(function(c){done();return new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej(new Error('blob'))},'image/png')})},function(e){done();throw e});
}

window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(VIEWS.indexOf(h)>=0&&h!==view){view=h;render()}});
window.addEventListener('storage',function(e){if(e.key===KEY){var s=load();if(s){state=s;fixState();render()}}});
render();
phLoadAll().then(render);
})();
