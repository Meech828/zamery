<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калькулятор замеров</title>
<meta name="description" content="Личный калькулятор замеров тела: вес и объёмы, дашборд прогресса. Данные хранятся только на вашем устройстве.">
<meta name="theme-color" content="#12382f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Замеры">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2312382f'/%3E%3Cg stroke='%23e4f78a' stroke-width='5' stroke-linecap='round'%3E%3Cpath d='M14 22h36M18 22v14M27 22v8M36 22v14M45 22v8'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2312382f'/%3E%3Cg stroke='%23e4f78a' stroke-width='5' stroke-linecap='round'%3E%3Cpath d='M14 22h36M18 22v14M27 22v8M36 22v14M45 22v8'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<style>
:root{--ink:#10302a;--dark:#12382f;--muted:#5b6670;--bg:#eef1ec;--card:#fafaf8;--line:#e3e7e2;--lime:#e4f78a;--good-bg:#d9eee2;--good:#0b7a55;--bad-bg:#fbe4de;--bad:#b4412f;--neu-bg:#e9ece9;--neu:#55605c;--hl:#e5eee8;--focus:#9fd7bd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 48px}
.hidden{display:none!important}

/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em;font-size:14px;text-transform:uppercase;margin-right:auto}
.logo{width:34px;height:34px;border-radius:9px;background:var(--dark);display:grid;place-items:center;flex:none}
.tabs{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px}
.tab{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.tab svg{flex:none}
.tab.on{background:var(--dark);color:#fff}
.savebox{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#7fbf9f;flex:none}
.dot.err{background:var(--bad)}

/* controls */
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 15px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
.btn:hover{border-color:#b9c4bd}
.btn.pri{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.pri:hover{background:#1b4a3e}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--dark)}
.btn.big{padding:14px 22px;font-size:16px;border-radius:14px}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.sel{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-weight:600;font-size:14px;max-width:100%}
.inp{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fbfcfb;font-size:16px}
.inp:focus,.sel:focus{outline:2px solid var(--focus);border-color:#6dbb98}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.panel h2{margin:0 0 4px;font-size:20px}
.panel .sub{color:var(--muted);font-size:14px;margin:0 0 16px;line-height:1.5}
.fld label,.lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.msg{font-size:14px;color:var(--good);font-weight:700;min-height:20px;margin-top:10px}
.msg.err{color:var(--bad)}
.hint{font-size:13px;color:var(--muted);line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px dashed #b9c4bd;background:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip:hover{border-style:solid;color:var(--ink)}
.seg{display:inline-flex;background:var(--bg);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:9px;padding:8px 13px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,48,42,.12)}
.switch{position:relative;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch i{width:38px;height:22px;border-radius:999px;background:#cfd6d1;position:relative;transition:.15s;flex:none}
.switch i:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+i{background:var(--good)}
.switch input:checked+i:after{left:19px}
.switch input:focus-visible+i{outline:2px solid var(--focus)}
details.rules{background:var(--bg);border-radius:14px;padding:12px 16px;margin-top:4px}
details.rules summary{font-weight:700;cursor:pointer;font-size:14px}
details.rules ol{margin:10px 0 2px;padding-left:20px;line-height:1.6;font-size:14px;color:var(--ink)}

/* onboarding */
.ob{max-width:620px;margin:0 auto}
.ob-steps{display:flex;gap:6px;margin:4px 0 18px}
.ob-steps span{flex:1;height:5px;border-radius:3px;background:#d6ddd8}
.ob-steps span.on{background:var(--dark)}
.ob h1{font-size:clamp(26px,5vw,34px);margin:0 0 6px;line-height:1.15}
.ob .lead{color:var(--muted);font-size:16px;margin:0 0 22px;line-height:1.5}
.sex{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sexcard{border:2px solid var(--line);background:#fff;border-radius:20px;padding:22px 14px 18px;text-align:center;font-weight:800;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.sexcard small{font-weight:600;font-size:13px;color:var(--muted)}
.sexcard:hover{border-color:#b9c4bd}
.sexcard.on{border-color:var(--dark);background:#f3f8f4;box-shadow:0 0 0 3px #d6eadf}
.sexcard .ic{width:58px;height:58px;border-radius:16px;background:var(--dark);display:grid;place-items:center}
.plist{display:flex;flex-direction:column;gap:8px}
.pgroup{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.pitem{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer;text-align:left;width:100%}
.pitem.on{border-color:var(--dark);background:#f6faf7}
.pitem .ck{width:22px;height:22px;border-radius:7px;border:2px solid #b9c4bd;flex:none;display:grid;place-items:center}
.pitem.on .ck{background:var(--dark);border-color:var(--dark)}
.pitem .tx{flex:1;min-width:0}
.pitem b{display:block;font-size:15px}
.pitem small{display:block;color:var(--muted);font-size:13px;margin-top:2px;line-height:1.4}
.pitem .u{font-size:13px;color:var(--muted);font-weight:600}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 0;font-weight:800;font-size:15px}
.wd.on{background:var(--dark);border-color:var(--dark);color:#fff}
.ob-nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px;align-items:center}

/* input */
.next{display:flex;align-items:center;gap:12px;background:var(--dark);color:#fff;border-radius:16px;padding:14px 18px;margin-bottom:16px}
.next b{color:var(--lime)}
.next .t{flex:1;font-size:15px;line-height:1.45}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mf label{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:14px;font-weight:800;color:var(--ink);margin-bottom:3px}
.mf label span{font-size:12px;font-weight:600;color:var(--muted)}
.mf .h{font-size:12px;color:var(--muted);line-height:1.35;margin-bottom:6px;min-height:16px}
.mf .iw{position:relative}
.mf .dl{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:800;pointer-events:none}
.dl.good{color:var(--good)}.dl.bad{color:var(--bad)}.dl.neu{color:var(--muted)}
.mf .inp{padding-right:74px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.ed{border-collapse:collapse;width:100%;font-size:14px}
table.ed th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px;white-space:nowrap}
table.ed td{padding:4px 5px;border-top:1px solid var(--line)}
table.ed .inp{padding:7px 8px;font-size:14px;min-width:66px}
table.ed input[type=date].inp{min-width:140px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty h2{color:var(--ink)}

/* settings metric cards */
.mlist{display:flex;flex-direction:column;gap:10px}
.mcard{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fbfcfb}
.mcard.off{opacity:.62}
.mrow1,.mrow2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mrow2{margin-top:10px;gap:10px 16px}
.mrow1 .inp{padding:8px 10px;font-size:15px}
.mrow1 .nm{flex:1 1 160px;font-weight:700}
.mrow1 .un{width:84px;flex:none}
.mrow2 .note{flex:1 1 180px;padding:7px 10px;font-size:14px}
.radio{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.radio input{accent-color:var(--dark);width:16px;height:16px}

/* dashboard */
.dtools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 14px}
#dash{background:linear-gradient(160deg,#f6f7f3,#eef1ec);border-radius:22px;padding:30px 28px 22px;max-width:960px;margin:0 auto}
.d-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.d-brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.08em;font-size:15px}
.d-pill{background:#dfe9e2;border-radius:999px;padding:7px 20px;font-weight:800;font-size:17px;white-space:nowrap}
.d-title{font-size:clamp(30px,6vw,56px);font-weight:800;line-height:1.08;margin:22px 0 8px;letter-spacing:-.01em}
.d-range{font-size:clamp(16px,2.4vw,22px);color:var(--muted);margin-bottom:22px}
.hero{background:var(--dark);color:#fff;border-radius:24px;padding:30px 36px}
.hero-lbl{font-weight:800;letter-spacing:.06em;font-size:15px;color:#e8efe9}
.hero-mid{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:14px 0 22px}
.hero-big{font-size:clamp(44px,9vw,76px);font-weight:800;line-height:1;color:var(--lime);letter-spacing:-.01em}
.hero-big.bad{color:#ffb3a1}.hero-big.neu{color:#fff}
.hero-pct{text-align:center}
.hero-pct b{display:block;font-size:clamp(26px,4vw,38px);color:var(--lime);font-weight:800}
.hero-pct b.bad{color:#ffb3a1}.hero-pct b.neu{color:#fff}
.hero-pct span{font-size:15px;color:#d5e1da}
.chain{display:flex;align-items:flex-start;flex-wrap:wrap;gap:6px 0;justify-content:space-between}
.ch{text-align:center;min-width:92px}
.ch b{display:block;font-size:clamp(17px,2.4vw,23px);font-weight:800;white-space:nowrap}
.ch span{display:block;font-size:15px;color:#d5e1da;margin-top:8px}
.ch.last b{color:var(--lime)}.ch.last span{color:#fff;font-weight:800}
.arr{font-size:20px;font-weight:700;padding:0 6px;color:#e8efe9;line-height:1.4}
.hero-foot{border-top:1.5px solid rgba(255,255,255,.28);margin-top:20px;padding-top:16px;font-weight:800;font-size:clamp(16px,2.2vw,21px);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}
.hero-foot .vol{color:var(--lime)}
.d-h2{font-size:clamp(26px,4vw,36px);font-weight:800;margin:30px 0 6px}
.d-sub{color:var(--muted);font-size:18px;margin-bottom:16px}
.d-sub b{color:var(--good)}
.tblcard{background:var(--card);border-radius:22px;padding:8px 20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table.dt{border-collapse:separate;border-spacing:0;width:100%;min-width:560px}
table.dt th{font-size:13px;font-weight:800;letter-spacing:.04em;text-align:center;padding:16px 6px 14px;white-space:nowrap}
table.dt th:first-child{text-align:left;padding-left:12px}
table.dt td{text-align:center;font-size:21px;color:#5a6670;padding:15px 6px;border-top:1px solid var(--line);white-space:nowrap}
table.dt tr:first-child td{border-top-color:#dde2dd}
table.dt td.nm{text-align:left;color:var(--ink);font-weight:800;padding-left:12px}
.nm .b{display:inline-block;width:7px;height:7px;border-radius:50%;background:#0c8a62;margin-right:12px;vertical-align:middle;position:relative;top:-2px}
.nm small{display:block;font-weight:500;font-size:13px;color:var(--muted);margin-left:19px;margin-top:2px;white-space:normal}
.nm em{font-style:normal;font-weight:500;font-size:13px;color:var(--muted);margin-left:6px}
table.dt .hl{background:var(--hl);color:var(--ink);font-weight:800}
table.dt th.hl{border-radius:14px 14px 0 0}
table.dt tr:last-child td.hl{border-radius:0 0 14px 14px}
.pl{display:inline-block;border-radius:12px;padding:9px 12px;font-size:17px;font-weight:800;min-width:104px;white-space:nowrap}
.pl.good{background:var(--good-bg);color:var(--good)}
.pl.bad{background:var(--bad-bg);color:var(--bad)}
.pl.neu{background:var(--neu-bg);color:var(--neu)}
.d-notes{color:var(--muted);font-size:15px;line-height:1.75;margin:16px 0 0}
.d-foot{border-top:1px solid #d5dbd5;margin-top:16px;padding-top:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.d-foot b{letter-spacing:.04em}

@media (max-width:640px){
 .wrap{padding:12px 10px calc(96px + env(safe-area-inset-bottom))}
 .bar{margin-bottom:12px}
 .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:0;border:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
 .tab{flex:1;flex-direction:column;gap:3px;font-size:11px;padding:7px 4px;border-radius:12px}
 .tab.on{background:var(--hl);color:var(--dark)}
 .savebox .stx{display:none}
 .panel{padding:16px;border-radius:16px}
 #dash{padding:20px 14px 16px;border-radius:16px}
 .hero{padding:22px 18px;border-radius:18px}
 .chain{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 4px}.arr{display:none}.ch{min-width:0}
 .tblcard{padding:4px 8px}
 table.dt td{font-size:17px}
 table.dt td.nm,table.dt th:first-child{position:sticky;left:0;z-index:1;background:var(--card);box-shadow:6px 0 8px -6px rgba(16,48,42,.18)}
 #dash.snapping table.dt td.nm,#dash.snapping table.dt th:first-child{position:static;box-shadow:none}
 .pl{min-width:84px;font-size:15px}
 .mgrid{grid-template-columns:1fr 1fr;gap:12px 10px}
 .mf .inp{padding-right:58px}
 .mf .dl{font-size:12px;right:8px}
 .wd{padding:11px 0;font-size:14px}
 .sexcard{padding:18px 10px 14px}
 .mrow1{flex-wrap:nowrap;gap:4px}.mrow1 .nm{flex:1 1 0;min-width:0}.mrow1 .un{width:58px;padding:8px 6px}.mrow1 .btn.sm{padding:5px 7px}
}
@media (max-width:370px){.mgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<noscript><p style="padding:20px">Для работы калькулятора включите JavaScript.</p></noscript>
<script>
(function(){
'use strict';

/* ================= справочник параметров ================= */
// g — «хорошо, когда» по умолчанию; gm — особое значение для мужчин
var CAT={
  weight:{n:'Вес',u:'кг',g:'down',h:'Утром натощак, после туалета, в одной и той же одежде'},
  neck:{n:'Шея',u:'см',g:'down',h:'В самом узком месте шеи'},
  chest:{n:'Грудь',u:'см',g:'down',h:'По самым выступающим точкам, лента горизонтально'},
  underbust:{n:'Под грудью',u:'см',g:'down',h:'Сразу под грудью, лента горизонтально'},
  shoulders:{n:'Плечи',u:'см',g:'down',gm:'up',h:'По самым выступающим точкам плеч'},
  arm:{n:'Рука',u:'см',g:'down',gm:'up',h:'Самое широкое место плеча, рука опущена и расслаблена'},
  arm_r:{n:'Правая рука',u:'см',g:'down',h:'Самое широкое место плеча, рука расслаблена'},
  arm_l:{n:'Левая рука',u:'см',g:'down',h:'Самое широкое место плеча, рука расслаблена'},
  forearm:{n:'Предплечье',u:'см',g:'down',gm:'up',h:'Самое широкое место ниже локтя'},
  waist:{n:'Талия',u:'см',g:'down',h:'Самое узкое место, на спокойном выдохе, живот не втягивать'},
  belly:{n:'Живот',u:'см',g:'down',h:'По линии пупка, на спокойном выдохе'},
  hips:{n:'Бёдра',u:'см',g:'down',h:'По самым выступающим точкам ягодиц, стопы вместе'},
  thigh:{n:'Нога',u:'см',g:'down',h:'Самое широкое место бедра, сразу под ягодицей'},
  thigh_r:{n:'Правое бедро',u:'см',g:'down',h:'Самое широкое место бедра, сразу под ягодицей'},
  thigh_l:{n:'Левое бедро',u:'см',g:'down',h:'Самое широкое место бедра, сразу под ягодицей'},
  calf:{n:'Икра',u:'см',g:'down',h:'Самое широкое место икры, стоя'},
  calf_r:{n:'Правая голень',u:'см',g:'down',h:'Самое широкое место икры, стоя'},
  calf_l:{n:'Левая голень',u:'см',g:'down',h:'Самое широкое место икры, стоя'},
  fat:{n:'% жира',u:'%',g:'down',h:'Всегда одним и тем же способом (весы или калипер)'},
  muscle:{n:'Мышечная масса',u:'кг',g:'up',h:'По умным весам, в одно и то же время'},
  pulse:{n:'Пульс в покое',u:'уд/мин',g:'down',h:'Утром сразу после пробуждения, лёжа'}
};
var ORDER=['weight','neck','chest','underbust','shoulders','arm','arm_r','arm_l','forearm','waist','belly','hips','thigh','thigh_r','thigh_l','calf','calf_r','calf_l','fat','muscle','pulse'];
var SETS={
  f:{base:['weight','neck','chest','arm_r','arm_l','waist','hips','thigh_r','thigh_l','calf_r','calf_l'],extra:['underbust','belly','shoulders','forearm','fat','muscle','pulse']},
  m:{base:['weight','chest','arm','waist','hips','thigh','calf'],extra:['neck','belly','shoulders','forearm','fat','muscle','pulse']}
};
function goalFor(key,sex){var c=CAT[key];return sex==='m'&&c.gm?c.gm:c.g}

/* ================= утилиты ================= */
var KEY='zamery-calc-v2';
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(s){s=String(s==null?'':s).trim().replace(/\s/g,'').replace(',','.');if(s==='')return null;var n=parseFloat(s);return isFinite(n)&&/^-?\d*\.?\d+$/.test(s)?n:null}
function r1(n){return Math.round(n*10)/10}
function fmt(n){if(n==null)return '—';return String(r1(n)).replace('.',',').replace('-','−')}
function inVal(n){return n==null?'':String(n).replace('.',',')}
function signed(d,unit,fixed){var r=r1(d);var s=fixed?Math.abs(r).toFixed(1):String(Math.abs(r));s=s.replace('.',',');return (r>0?'+':r<0?'−':'')+s+(unit?' '+unit:'')}
function pD(s){return new Date(s+'T00:00:00')}
function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function today(){return iso(new Date())}
function dm(s){return s.slice(8,10)+'.'+s.slice(5,7)}
function days(a,b){return Math.round((pD(b)-pD(a))/864e5)}
var MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var WDS=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
var WDPO=['по воскресеньям','по понедельникам','по вторникам','по средам','по четвергам','по пятницам','по субботам'];
var WDN=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
function longD(s,withYear){var d=pD(s);return d.getDate()+' '+MG[d.getMonth()]+(withYear?' '+d.getFullYear():'')}
function plural(n,a,b,c){n=Math.abs(n)%100;var m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c}
var WW={1:'неделю',2:'две недели',3:'три недели',4:'четыре недели',5:'пять недель',6:'шесть недель',7:'семь недель',8:'восемь недель',9:'девять недель',10:'десять недель',11:'одиннадцать недель',12:'двенадцать недель'};
function autoTitle(E){if(E.length<2)return 'Первый замер';var d=days(E[0].date,E[E.length-1].date);if(d<7)return 'Замеры за '+d+' '+plural(d,'день','дня','дней');var w=Math.round(d/7);return 'Замеры за '+(WW[w]||w+' '+plural(w,'неделю','недели','недель'))}
function cls(d,goal){var r=r1(d);if(r===0||goal==='none')return 'neu';if(goal==='up')return r>0?'good':'bad';return r<0?'good':'bad'}
function val(e,id){var v=e&&e.v[id];return typeof v==='number'?v:null}
function nextDay(wd){var d=new Date();d.setHours(0,0,0,0);var diff=(wd-d.getDay()+7)%7;d.setDate(d.getDate()+diff);return {date:iso(d),diff:diff}}
function slug(s){return String(s).toLowerCase().replace(/[^a-zа-яё0-9]+/gi,'-').replace(/^-|-$/g,'')||'data'}

/* ================= состояние ================= */
var storageOk=true;
try{localStorage.setItem('zamery-t','1');localStorage.removeItem('zamery-t')}catch(e){storageOk=false}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
var state=load()||{v:2,activeId:null,window:0,hints:true,people:[]};
fixState();

function newPerson(){return{id:uid(),name:'',sex:'',weekday:new Date().getDay(),setup:false,title:'',footer:'По вашим замерам',metrics:[],entries:[]}}
function fixState(){
  if(!state||!Array.isArray(state.people))state={v:2,people:[]};
  state.v=2;if(state.hints==null)state.hints=true;state.window=+state.window||0;
  if(!state.people.length){var p=newPerson();state.people=[p];state.activeId=p.id}
  if(!state.people.some(function(p){return p.id===state.activeId}))state.activeId=state.people[0].id;
  state.people.forEach(function(p){
    p.id=p.id||uid();p.metrics=Array.isArray(p.metrics)?p.metrics:[];p.entries=Array.isArray(p.entries)?p.entries:[];
    if(p.setup==null)p.setup=p.metrics.length>0;   // данные из старой версии
    if(p.sex==null)p.sex='';if(p.weekday==null)p.weekday=1;if(p.footer==null)p.footer='По вашим замерам';if(p.title==null)p.title='';if(p.name==null)p.name='';
    p.metrics.forEach(function(m){m.id=m.id||uid();if(m.show==null)m.show=true;if(!m.goal)m.goal='down';if(m.unit==null)m.unit='';if(m.note==null)m.note=''});
    p.entries=p.entries.filter(function(e){return e&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)});
    p.entries.forEach(function(e){e.v=e.v||{}});sortEntries(p);
  });
}
function sortEntries(p){p.entries.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0})}
function P(){for(var i=0;i<state.people.length;i++)if(state.people[i].id===state.activeId)return state.people[i];return state.people[0]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOk=true}catch(e){storageOk=false}renderBar()}
function winEntries(p){var n=state.window;return n?p.entries.slice(-n):p.entries.slice()}
function metricFromKey(key,sex){var c=CAT[key];return{id:uid(),key:key,name:c.n,unit:c.u,goal:goalFor(key,sex),note:'',show:true}}
function hintOf(m){return m.key&&CAT[m.key]?CAT[m.key].h:''}

/* ================= рендер ================= */
function render(){
  var p=P();
  var h='<div class="wrap"><div class="bar" id="bar"></div>';
  if(!p.setup)h+=obView();
  else if(view==='dash')h+=dashView(p);else if(view==='input')h+=inputView(p);else h+=paramsView(p);
  root.innerHTML=h+'</div>';renderBar();
}
function renderBar(){
  var b=document.getElementById('bar');if(!b)return;
  var p=P();
  var ppl=state.people.length>1&&p.setup?'<select class="sel" data-f="person" aria-label="Человек">'+state.people.map(function(x){return '<option value="'+x.id+'"'+(x.id===p.id?' selected':'')+'>'+esc(x.name||'Без имени')+'</option>'}).join('')+'</select>':'';
  var st=storageOk?'Сохранено на этом устройстве':'Браузер не даёт сохранять — сделайте резервную копию';
  var tabs=p.setup?'<nav class="tabs">'+[['dash','Дашборд'],['input','Замер'],['params','Настройки']].map(function(t){return '<button class="tab'+(view===t[0]?' on':'')+'" data-act="tab" data-v="'+t[0]+'">'+IC[t[0]]+'<span>'+t[1]+'</span></button>'}).join('')+'</nav>':'';
  b.innerHTML='<div class="brand"><span class="logo">'+LOGO+'</span>Личные замеры</div>'+ppl+tabs+
    (p.setup?'<div class="savebox" title="'+esc(st)+'"><span class="dot'+(storageOk?'':' err')+'"></span><span class="stx">'+st+'</span></div>':'');
}

/* ---------- онбординг ---------- */
function startOb(){var p=P();ob={step:1,sex:p.sex||'',name:p.name||'',keys:{},custom:[],weekday:p.weekday!=null?p.weekday:new Date().getDay(),customName:''};if(ob.sex)SETS[ob.sex].base.forEach(function(k){ob.keys[k]=true})}
function obView(){
  if(!ob)startOb();
  var steps='<div class="ob-steps">'+[1,2,3].map(function(i){return '<span class="'+(i<=ob.step?'on':'')+'"></span>'}).join('')+'</div>';
  var h='<div class="ob">'+steps;
  var canBack=ob.step>1||state.people.filter(function(x){return x.setup}).length>0;
  if(ob.step===1){
    h+='<h1>Давайте настроим ваши замеры</h1><p class="lead">Это займёт меньше минуты. Все данные хранятся только у вас на устройстве.</p>';
    h+='<div class="lbl">Кто будет замеряться</div><div class="sex">'+
      [['f','Женщина','11 замеров по схеме'],['m','Мужчина','7 замеров по схеме']].map(function(s){return '<button class="sexcard'+(ob.sex===s[0]?' on':'')+'" data-act="obSex" data-v="'+s[0]+'"><span class="ic">'+FIG[s[0]]+'</span>'+s[1]+'<small>'+s[2]+'</small></button>'}).join('')+'</div>';
    h+='<div class="fld" style="margin-top:20px"><label for="obname">Имя (необязательно)</label><input class="inp" id="obname" data-f="obname" value="'+esc(ob.name)+'" placeholder="Например, Анна" autocomplete="given-name"></div>';
    h+='<div class="ob-nav">'+(canBack?'<button class="btn ghost" data-act="obCancel">Отмена</button>':'<span></span>')+'<button class="btn pri big" data-act="obNext"'+(ob.sex?'':' disabled')+'>Дальше</button></div>';
  }else if(ob.step===2){
    var S=SETS[ob.sex];
    h+='<h1>Что будем измерять?</h1><p class="lead">Основные замеры уже отмечены по схеме. Добавьте то, что важно именно вам, — всё отмеченное появится на дашборде. Изменить можно в любой момент.</p>';
    h+='<div class="pgroup">Основные замеры</div><div class="plist">'+S.base.map(pItem).join('')+'</div>';
    h+='<div class="pgroup">Дополнительно</div><div class="plist">'+S.extra.map(pItem).join('')+'</div>';
    h+='<div class="pgroup">Свои проблемные зоны</div><div class="plist">'+ob.custom.map(function(c,i){return '<button class="pitem on" data-act="obDelCustom" data-i="'+i+'"><span class="ck">'+CHECK+'</span><span class="tx"><b>'+esc(c)+'</b><small>Нажмите, чтобы убрать</small></span><span class="u">см</span></button>'}).join('')+'</div>';
    h+='<div class="row" style="display:flex;gap:8px;margin-top:8px"><input class="inp" data-f="obcustom" id="obcustom" value="'+esc(ob.customName)+'" placeholder="Например, над коленом" style="flex:1"><button class="btn" data-act="obAddCustom">Добавить</button></div>';
    var cnt=Object.keys(ob.keys).filter(function(k){return ob.keys[k]}).length+ob.custom.length;
    h+='<div class="ob-nav"><button class="btn ghost" data-act="obBack">Назад</button><button class="btn pri big" data-act="obNext"'+(cnt?'':' disabled')+'>Дальше · '+cnt+' '+plural(cnt,'замер','замера','замеров')+'</button></div>';
  }else{
    h+='<h1>В какой день будете мериться?</h1><p class="lead">Замеры делают раз в неделю, в один и тот же день — обычно в день недели, когда вы начали. Так динамика будет честной.</p>';
    h+='<div class="wdays">'+[1,2,3,4,5,6,0].map(function(d){return '<button class="wd'+(ob.weekday===d?' on':'')+'" data-act="obWd" data-v="'+d+'">'+WDS[d]+'</button>'}).join('')+'</div>';
    h+='<p class="hint" style="margin-top:10px">Замеры '+WDPO[ob.weekday]+'. Приложение подскажет дату следующего замера.</p>';
    h+=rulesBlock(true);
    h+='<div class="ob-nav"><button class="btn ghost" data-act="obBack">Назад</button><button class="btn pri big" data-act="obDone">Готово — внести замер</button></div>';

function pItem(k){var c=CAT[k],on=!!ob.keys[k];return '<button class="pitem'+(on?' on':'')+'" data-act="obToggle" data-k="'+k+'" aria-pressed="'+on+'"><span class="ck">'+(on?CHECK:'')+'</span><span class="tx"><b>'+c.n+'</b><small>'+c.h+'</small></span><span class="u">'+c.u+'</span></button>'}
function rulesBlock(open){
  return '<details class="rules"'+(open?' open':'')+'><summary>Как правильно делать замеры</summary><ol>'+
   '<li>Раз в неделю, в один и тот же день недели, утром натощак.</li>'+

   '<li>Сантиметровая лента прилегает плотно, но не сдавливает кожу, и идёт параллельно полу.</li>'+
   '<li>Стойте прямо и расслабленно, живот не втягивайте, мерьте на спокойном выдохе.</li>'+
   '<li>Мерьте каждый раз в одних и тех же точках — так видна реальная динамика.</li>'+
   '<li>Отдельно отслеживайте свои проблемные зоны — их можно добавить в настройках.</li></ol></details>';
}

/* ---------- дашборд ---------- */
var shareSupported=false;
try{shareSupported=!!(navigator.canShare&&navigator.canShare({files:[new File([new Blob(['x'])],'t.png',{type:'image/png'})]}))}catch(e){}
var copySupported=!!(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write);

function dashView(p){
  var E=winEntries(p);
  var tools='<div class="dtools">'+
    (shareSupported?'<button class="btn pri" data-act="share">Поделиться картинкой</button>':'')+
    (copySupported&&!shareSupported?'<button class="btn pri" data-act="copyimg">Скопировать картинку</button>':'')+
    '<button class="btn" data-act="png">Скачать PNG</button>'+
    (copySupported&&shareSupported?'<button class="btn" data-act="copyimg">Скопировать</button>':'')+
    '<select class="sel" data-f="window" aria-label="Период">'+[[0,'Весь период'],[4,'Последние 4 замера'],[6,'Последние 6 замеров'],[8,'Последние 8 замеров'],[12,'Последние 12 замеров']].map(function(o){return '<option value="'+o[0]+'"'+(state.window===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></div>'+
    '<div class="msg'+(msgErr.dash?' err':'')+'" style="text-align:center;margin:-6px 0 8px">'+esc(msg.dash)+'</div>';
  if(!E.length){var nd=nextDay(p.weekday);return '<div class="panel empty"><h2>Пока нет замеров</h2><p>'+(nd.diff===0?'Сегодня ваш день замеров!':'Следующий день замеров — '+WDN[p.weekday]+', '+longD(nd.date)+'.')+'<br>Внесите первый замер, и здесь появится дашборд.</p><button class="btn pri big" data-act="tab" data-v="input">Внести замер</button></div>'}
  var vis=p.metrics.filter(function(m){return m.show!==false});
  var first=E[0].date,last=E[E.length-1].date,dd=days(first,last);
  var sameY=pD(first).getFullYear()===pD(last).getFullYear();
  var main=null;vis.forEach(function(m){if(m.main&&!main)main=m});
  var others=vis.filter(function(m){return m!==main&&E.some(function(e){return val(e,m.id)!=null})});

  // сумма объёмов: все сантиметровые параметры, где «хорошо — уменьшается»
  var volSum=0,volN=0;
  others.forEach(function(m){if(m.unit!=='см'||m.goal!=='down')return;var vs=E.map(function(e){return val(e,m.id)}).filter(function(v){return v!=null});if(vs.length>1){volSum+=vs[vs.length-1]-vs[0];volN++}});
  var volTxt=volN>1?(r1(volSum)<=0?'Ушло в объёмах: ':'Прибавилось в объёмах: ')+signed(volSum,'см'):'';

  var h='<div id="dash"><div class="d-top"><div class="d-brand"><span class="logo">'+LOGO+'</span>ЛИЧНЫЕ ЗАМЕРЫ'+(p.name?' · '+esc(p.name).toUpperCase():'')+'</div><div class="d-pill">'+dd+' '+plural(dd,'день','дня','дней')+'</div></div>';
  h+='<div class="d-title">'+esc(p.title||autoTitle(E))+'</div>';
  h+='<div class="d-range">'+(E.length>1?longD(first,!sameY)+' &nbsp;→&nbsp; '+longD(last,true):longD(first,true))+'</div>';
  var heroDone=false;
  if(main){
    var pts=E.filter(function(e){return val(e,main.id)!=null});
    if(pts.length){
      heroDone=true;
      var v0=val(pts[0],main.id),vl=val(pts[pts.length-1],main.id),d=vl-v0,c=pts.length>1?cls(d,main.goal):'neu';
      var pct=v0?d/v0*100:0;
      h+='<div class="hero"><div class="hero-lbl">'+esc(main.name.toUpperCase())+' · ДАННЫЕ ПО '+dm(pts[pts.length-1].date)+'</div>';
      h+='<div class="hero-mid"><div class="hero-big '+(c==='good'?'':c)+'">'+(pts.length>1?signed(d,main.unit,true):fmt(vl)+' '+esc(main.unit))+'</div>';
      if(pts.length>1)h+='<div class="hero-pct"><b class="'+(c==='good'?'':c)+'">'+signed(pct,'',true)+'%</b><span>от исходного '+(main.name.trim().toLowerCase()==='вес'?'веса':'значения')+'</span></div>';
      h+='</div><div class="chain">';
      var show=pts.length>8?[pts[0],null].concat(pts.slice(-6)):pts;
      show.forEach(function(e,i){if(i)h+='<span class="arr">→</span>';if(!e){h+='<div class="ch"><b>…</b><span>&nbsp;</span></div>';return}h+='<div class="ch'+(i===show.length-1?' last':'')+'"><b>'+fmt(val(e,main.id))+' '+esc(main.unit)+'</b><span>'+dm(e.date)+'</span></div>'});
      h+='</div>';
      var foot=[];
      if(pts.length>1){var pr=pts[pts.length-2],gap=days(pr.date,pts[pts.length-1].date);
        foot.push('<span>'+(gap===7?'За неделю':'С прошлого замера')+' ('+dm(pr.date)+'–'+dm(pts[pts.length-1].date)+') &nbsp;'+signed(vl-val(pr,main.id),main.unit,true)+'</span>')}
      if(volTxt)foot.push('<span class="vol">'+volTxt+'</span>');
      if(foot.length)h+='<div class="hero-foot">'+foot.join('')+'</div>';
      h+='</div>';
    }
  }
  if(others.length){
    var units={};others.forEach(function(m){units[m.unit||'']=1});var uk=Object.keys(units),oneU=uk.length===1;
    var uName={'см':'сантиметрах','мм':'миллиметрах','кг':'килограммах','%':'процентах'};
    h+='<div class="d-h2">'+(oneU&&uk[0]==='см'?'Объёмы тела':'Замеры')+'</div><div class="d-sub">'+(oneU&&uk[0]?'Все значения в '+(uName[uk[0]]||uk[0]):'Единицы указаны у каждого параметра')+(!heroDone&&volTxt?' · <b>'+volTxt+'</b>':'')+'</div>';
    h+='<div class="tblcard"><table class="dt"><thead><tr><th>ЗАМЕР</th>';
    E.forEach(function(e,i){h+='<th'+(i===E.length-1?' class="hl"':'')+'>'+dm(e.date)+'</th>'});
    h+='<th>ИТОГО*</th></tr></thead><tbody>';
    others.forEach(function(m){
      h+='<tr><td class="nm"><span class="b"></span>'+esc(m.name)+(!oneU&&m.unit?'<em>'+esc(m.unit)+'</em>':'')+(m.note?'<small>'+esc(m.note)+'</small>':'')+'</td>';
      var vs=[];

  return tools+h;

function updateDelta(inp){

function say(where,text,err){msg[where]=text;msgErr[where]=!!err;render();if(text)setTimeout(function(){if(msg[where]===text){msg[where]='';var els=root.querySelectorAll('.msg');for(var i=0;i<els.length;i++)if(els[i].textContent===text)els[i].textContent=''}},4500)}
function arm(k){armed=k;clearTimeout(armTimer);armTimer=setTimeout(function(){armed=null;render()},3500);render()}
function go(v){view=v;try{history.replaceState(null,'','#'+v)}catch(e){}render();window.scrollTo(0,0)}

/* ================= события ================= */
root.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.getAttribute('data-act'),p=P();
  // онбординг
  if(a==='obSex'){var s=b.getAttribute('data-v');if(ob.sex!==s){ob.sex=s;ob.keys={};SETS[s].base.forEach(function(k){ob.keys[k]=true})}render();return}
  if(a==='obNext'){if(ob.step===1&&!ob.sex)return;ob.step++;render();window.scrollTo(0,0);return}
  if(a==='obBack'){if(ob.step>1)ob.step--;render();window.scrollTo(0,0);return}
  if(a==='obCancel'){var prev=state.people.filter(function(x){return x.setup});if(!prev.length)return;
    if(!p.setup&&!p.entries.length)state.people=state.people.filter(function(x){return x!==p});
    state.activeId=prev[0].id;ob=null;persist();go('params');return}
  if(a==='obToggle'){var k=b.getAttribute('data-k');ob.keys[k]=!ob.keys[k];render();return}
  if(a==='obAddCustom'){var nm=(ob.customName||'').trim();if(!nm){var ci=document.getElementById('obcustom');if(ci)ci.focus();return}ob.custom.push(nm);ob.customName='';render();var ci2=document.getElementById('obcustom');if(ci2)ci2.focus();return}
  if(a==='obDelCustom'){ob.custom.splice(+b.getAttribute('data-i'),1);render();return}
  if(a==='obWd'){ob.weekday=+b.getAttribute('data-v');render();return}
  if(a==='obDone'){
    var keep={};p.metrics.forEach(function(m){if(m.key)keep[m.key]=m});
    var ms=ORDER.filter(function(k){return ob.keys[k]}).map(function(k){return keep[k]||metricFromKey(k,ob.sex)});
    // сохраняем уже существующие пользовательские параметры (при повторной настройке)
    p.metrics.forEach(function(m){if(!m.key&&ms.indexOf(m)<0)ms.push(m)});
    ob.custom.forEach(function(c){ms.push({id:uid(),name:c,unit:'см',goal:'down',note:'',show:true})});
    if(!ms.some(function(m){return m.main})){var w=ms.filter(function(m){return m.key==='weight'})[0];if(w)w.main=true}
    p.metrics=ms;p.sex=ob.sex;p.name=(ob.name||'').trim();p.weekday=ob.weekday;p.setup=true;ob=null;
    newDraft={};newDate='';justAdded=false;persist();go('input');return}
  // основное
  if(a==='tab'){justAdded=false;go(b.getAttribute('data-v'));return}
  if(a==='addEntry'){
    var vals={},bad=null;
    p.metrics.forEach(function(m){var raw=newDraft[m.id];if(raw==null||String(raw).trim()==='')return;var n=num(raw);if(n==null)bad=bad||m.name;else vals[m.id]=n});
    if(bad){say('input','Не похоже на число: '+bad,true);return}
    if(!newDate){say('input','Укажите дату',true);return}
    if(!Object.keys(vals).length){say('input','Заполните хотя бы одно значение',true);var f1=root.querySelector('[data-n]:not([data-n="__date"])');if(f1)f1.focus();return}
    var e=null;p.entries.forEach(function(x){if(x.date===newDate)e=x});
    if(e){for(var kk in vals)e.v[kk]=vals[kk]}else{p.entries.push({date:newDate,v:vals});sortEntries(p)}
    var txt=(e?'Замер за '+dm(newDate)+' обновлён':'Замер за '+dm(newDate)+' сохранён')+' ✓';
    newDraft={};justAdded=true;persist();say('input',txt);return}
  if(a==='delEntry'){var d=b.getAttribute('data-d');if(armed!=='e:'+d){arm('e:'+d);return}
    p.entries=p.entries.filter(function(x){return x.date!==d});armed=null;persist();render();return}
  if(a==='addMetric'){p.metrics.push({id:uid(),name:'Новый параметр',unit:'см',goal:'down',note:'',show:true});persist();render();var ins=root.querySelectorAll('[data-k="name"]');if(ins.length){ins[ins.length-1].focus();ins[ins.length-1].select()}return}
  if(a==='preset'){var key=b.getAttribute('data-k');var m=metricFromKey(key,p.sex);if(key==='weight'&&!p.metrics.some(function(q){return q.main}))m.main=true;
    // ставим на «своё» место по общему порядку
    var pos=p.metrics.length;for(var i=0;i<p.metrics.length;i++){var mk=p.metrics[i].key;if(mk&&ORDER.indexOf(mk)>ORDER.indexOf(key)){pos=i;break}}
    p.metrics.splice(pos,0,m);persist();render();return}
  if(a==='noMain'){p.metrics.forEach(function(m){delete m.main});persist();render();return}
  if(a==='delMetric'){var id=b.getAttribute('data-m');if(armed!=='m:'+id){arm('m:'+id);return}
    p.metrics=p.metrics.filter(function(m){return m.id!==id});p.entries.forEach(function(e){delete e.v[id]});armed=null;persist();render();return}
  if(a==='mv'){var id2=b.getAttribute('data-m'),dir=+b.getAttribute('data-dir'),ix=-1;p.metrics.forEach(function(m,j){if(m.id===id2)ix=j});var j=ix+dir;if(ix<0||j<0||j>=p.metrics.length)return;var t=p.metrics[ix];p.metrics[ix]=p.metrics[j];p.metrics[j]=t;persist();render();return}
  if(a==='psex'){p.sex=b.getAttribute('data-v');persist();render();return}
  if(a==='pwd'){p.weekday=+b.getAttribute('data-v');persist();render();return}
  if(a==='addPerson'){var np=newPerson();state.people.push(np);state.activeId=np.id;ob=null;persist();render();window.scrollTo(0,0);return}
  if(a==='delPerson'){if(armed!=='person'){arm('person');return}state.people=state.people.filter(function(x){return x.id!==p.id});state.activeId=state.people[0].id;armed=null;persist();render();return}
  if(a==='reset'){if(armed!=='reset'){arm('reset');return}armed=null;state={v:2,people:[]};fixState();ob=null;persist();go('dash');return}
  if(a==='backup'){download(new Blob([JSON.stringify(state,null,1)],{type:'application/json'}),'zamery-backup-'+today()+'.json');say('params','Резервная копия скачана');return}
  if(a==='csv'){download(new Blob(['﻿'+toCSV(p)],{type:'text/csv;charset=utf-8'}),'zamery-'+slug(p.name||'moi')+'.csv');return}
  if(a==='png'){if(!window.html2canvas){say('dash','Модуль картинок ещё не загрузился — проверьте интернет и попробуйте снова',true);return}
    snap().then(function(blob){download(blob,fileName())},function(){say('dash','Не удалось сделать картинку',true)});return}
  if(a==='share'){if(!window.html2canvas){say('dash','Модуль картинок ещё не загрузился — попробуйте через пару секунд',true);return}
    snap().then(function(blob){var file=new File([blob],fileName(),{type:'image/png'});
      return navigator.share({files:[file],title:'Мои замеры'}).catch(function(e){if(e&&e.name==='AbortError')return;download(blob,fileName())})},function(){say('dash','Не удалось сделать картинку',true)});return}
  if(a==='copyimg'){if(!window.html2canvas||!copySupported){say('dash','Этот браузер не умеет копировать картинки — используйте «Скачать PNG»',true);return}
    try{navigator.clipboard.write([new ClipboardItem({'image/png':snap()})]).then(function(){say('dash','Картинка скопирована — вставьте её в мессенджер или письмо')},function(){say('dash','Браузер не дал скопировать — используйте «Скачать PNG»',true)})}catch(e){say('dash','Браузер не дал скопировать — используйте «Скачать PNG»',true)}return}
});

  if(f==='hints'){state.hints=t.checked;persist();render();return}
  if(f==='pname'){p.name=t.value.trim();persist();return}
  if(f==='ptitle'){p.title=t.value.trim();persist();return}
  if(f==='pfooter'){p.footer=t.value.trim();persist();return}
  if(f==='main'){p.metrics.forEach(function(m){if(m.id===t.value)m.main=true;else delete m.main});persist();return}
  if(f==='show'){var id0=t.getAttribute('data-m');p.metrics.forEach(function(m){if(m.id===id0)m.show=t.checked});persist();var c=t.closest('.mcard');if(c)c.classList.toggle('off',!t.checked);return}
  if(f==='m'){var id=t.getAttribute('data-m'),k=t.getAttribute('data-k');p.metrics.forEach(function(m){if(m.id===id)m[k]=k==='name'?(t.value.trim()||'Без названия'):t.value.trim()});persist();return}
  if(f==='hv'){var d=t.getAttribute('data-d'),mid=t.getAttribute('data-m'),v=num(t.value);
    if(t.value.trim()!==''&&v==null){t.style.borderColor='#b4412f';return}t.style.borderColor='';
    p.entries.forEach(function(e){if(e.date===d){if(v==null)delete e.v[mid];else e.v[mid]=v}});
    t.value=inVal(v);persist();return}
  if(f==='hd'){var od=t.getAttribute('data-d'),nd=t.value;if(!nd){t.value=od;return}
    if(nd!==od&&p.entries.some(function(e){return e.date===nd})){t.value=od;say('input','Замер за '+dm(nd)+' уже есть',true);return}
    p.entries.forEach(function(e){if(e.date===od)e.date=nd});sortEntries(p);persist();render();return}
});

/* ================= файлы и картинки ================= */
function download(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000)}
function fileName(){return 'zamery-'+slug(P().name||'moi')+'-'+today()+'.png'}
function toCSV(p){
  var q=function(s){s=String(s);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  var rows=[['Дата'].concat(p.metrics.map(function(m){return m.name+(m.unit?' ('+m.unit+')':'')}))];
  p.entries.forEach(function(e){rows.push([dm(e.date)+'.'+e.date.slice(0,4)].concat(p.metrics.map(function(m){return inVal(val(e,m.id))})))});
  return rows.map(function(r){return r.map(q).join(';')}).join('\r\n');
}
function snap(){
  var el=document.getElementById('dash'),tc=el.querySelector('.tblcard');
  var extra=tc?Math.max(0,tc.scrollWidth-tc.clientWidth):0,w=el.offsetWidth+extra;
  el.classList.add('snapping');if(extra){el.style.width=w+'px';el.style.maxWidth='none';tc.style.overflow='visible'}
  var done=function(){el.classList.remove('snapping');el.style.width='';el.style.maxWidth='';if(tc)tc.style.overflow=''};
  return html2canvas(el,{scale:2,backgroundColor:'#eef1ec',logging:false,windowWidth:Math.max(document.documentElement.clientWidth,w+40)})
    .then(function(c){done();return new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej(new Error('blob'))},'image/png')})},function(e){done();throw e});
}

window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(VIEWS.indexOf(h)>=0&&h!==view){view=h;render()}});
window.addEventListener('storage',function(e){if(e.key===KEY){var s=load();if(s){state=s;fixState();render()}}});
render();
})();
</script>
